<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>PWA Firebase Notification</title>
  <!-- โหลด Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-messaging-compat.js"></script>
</head>
<body>
  <h1>ทดสอบส่งข้อมูลและแจ้งเตือน</h1>
  <button id="requestPermissionBtn">เปิดรับการแจ้งเตือน (ขอสิทธิ์)</button>
  <br><br>
  <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ...">
  <button id="sendBtn">ส่งข้อมูลไป Google Sheet</button>

  <script>
    // 1. ตั้งค่า Firebase (เอาค่า config ของคุณมาใส่)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      projectId: "YOUR_PROJECT_ID",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    // 2. ขอสิทธิ์และรับ Token
    document.getElementById('requestPermissionBtn').addEventListener('click', async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          // ขอ Token จาก Firebase
          const token = await messaging.getToken({ vapidKey: 'YOUR_VAPID_KEY_FROM_FIREBASE_CONSOLE' });
          console.log('FCM Token:', token);
          alert('พร้อมรับการแจ้งเตือนแล้ว!');
        }
      } catch (error) {
        console.error('Error getting token', error);
      }
    });

    // 3. จัดการเมื่อได้รับข้อความตอนเปิดเว็บอยู่ (Foreground)
    messaging.onMessage((payload) => {
      console.log('Message received. ', payload);
      alert("แจ้งเตือนใหม่: " + payload.notification.body);
    });

    // 4. ส่งข้อมูลไป Apps Script
    document.getElementById('sendBtn').addEventListener('click', () => {
      const msg = document.getElementById('msgInput').value;
      const gasUrl = "ใส่_WEB_APP_URL_ของคุณที่นี่"; 
      
      fetch(gasUrl, {
        method: 'POST',
        body: JSON.stringify({ message: msg, recipient: "All" }),
      }).then(res => res.json()).then(data => alert('บันทึกสำเร็จ'));
    });
  </script>
</body>
</html>
